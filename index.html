<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#797b96">
  <meta name="description" content="A small flock, an evening sky. A quiet interactive experiment.">
  <title>Dusk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="Dusk, an interactive evening sky">
    <canvas id="sky" aria-label="Two hundred birds flocking in an evening sky. Move your finger or pointer through them." role="img"></canvas>
    <div id="contact" class="contact" aria-hidden="true"></div>
    <header><h1>Dusk</h1></header>
    <footer>
      <nav aria-label="Sky controls">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <span aria-hidden="true">/</span>
        <button id="reset" type="button">Reset</button>
      </nav>
    </footer>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <noscript><p class="no-script">Dusk needs JavaScript to bring the birds to life.</p></noscript>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
